# Vercel deploys via the org's reusable workflow (single Pro seat; see the
# `github-actions` workspace project). `npm run check` gates every deploy — the
# launch plan's CI gate (D2): a commit that fails astro check or server tsc never ships.

name: Vercel

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  deploy:
    needs: check
    permissions:
      contents: read
      pull-requests: write
    uses: aiheroes/.github/.github/workflows/vercel-deploy.yml@main
    with:
      project-id: prj_0tK9SEmKfxNzV3KofjA7udj22vYf
      production: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    secrets: inherit
