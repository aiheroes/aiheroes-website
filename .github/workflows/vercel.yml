# Vercel deploy for aiheroes/aiheroes-website. `npm run check` gates every deploy
# (launch plan D2): a commit that fails astro check or server tsc never ships.
#
# The deploy job is INLINED (not the org's reusable workflow): this repo is
# public and aiheroes/.github is private, and GitHub forbids public repos from
# using reusable workflows in private repos (the call fails validation with
# zero jobs). Same steps as aiheroes/.github/.github/workflows/vercel-deploy.yml.
#
# Deploys use the team-scoped VERCEL_TOKEN repo secret, so commit authors don't
# need a Vercel seat. The re-author step rewrites HEAD (runner-local only) to
# the Vercel account owner, because Vercel checks the commit author against
# team membership.

name: Vercel

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_w7A0zuXMYcFlk9R5rJf3UoJa
  VERCEL_PROJECT_ID: prj_0tK9SEmKfxNzV3KofjA7udj22vYf
  PRODUCTION: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Re-author HEAD as the Vercel account owner
        run: |
          git config user.name  "fransjorden"
          git config user.email "frans@aiheroes.io"
          git commit --amend --no-edit --reset-author

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=${{ env.PRODUCTION == 'true' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build ${{ env.PRODUCTION == 'true' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ env.PRODUCTION == 'true' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${{ steps.deploy.outputs.url }}`;
            const marker = '<!-- vercel-preview-url -->';
            const body = `${marker}\n**Vercel preview:** ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
